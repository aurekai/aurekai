[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurekai"
version = "0.8.0a1"
description = "Python bridge for Aurekai, the operating fabric for intelligent work."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Aurekai" }]
keywords = ["ai", "artifacts", "runtime", "model-memory", "semantic-cache", "proof"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/aurekai/aurekai"
Repository = "https://github.com/aurekai/aurekai"
Issues = "https://github.com/aurekai/aurekai/issues"

[project.scripts]
aurekai = "aurekai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aurekai"]