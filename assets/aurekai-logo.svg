    </marker>

    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#185FA5"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>

    <linearGradient id="arrow-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>

    <linearGradient id="text-grad-aure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C2744"/>
      <stop offset="100%" stop-color="#183860"/>
    </linearGradient>

    
